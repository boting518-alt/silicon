[project]
name = "silicon"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.5", "sqlalchemy==2.0.52",
  "alembic==1.19.2", "psycopg[binary]==3.3.5", "uvicorn==0.52.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/silicon"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-ra"
