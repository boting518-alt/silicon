name: skeleton
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm install --global npm@11.12.1
      - run: python -m pip install uv==0.12.11
      - run: npm ci --ignore-scripts
      - run: uv sync --locked
      - run: uv run --locked python infra/export_openapi.py && npm run api:types
      - run: git diff --exit-code -- packages/api-client
      - run: node --test apps/web/tests/*.test.ts
      - run: npm run typecheck && npm run build
      - name: Build verified PostgreSQL 17.11
        run: python infra/build_test_postgres.py --prefix "$RUNNER_TEMP/silicon-pg17"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.6+7'
      - name: Fetch pinned Keycloak 26.7.3
        run: python infra/fetch_keycloak.py --destination "$RUNNER_TEMP/silicon-keycloak"
      - name: Real database, OIDC, API and Worker acceptance
        run: SILICON_TEST_PG_BIN="$RUNNER_TEMP/silicon-pg17/bin" SILICON_TEST_KEYCLOAK_HOME="$RUNNER_TEMP/silicon-keycloak/keycloak-26.7.3" uv run --locked pytest -v
      - run: uv run --locked python infra/check_docs.py
      - run: docker compose --env-file .env.example -f infra/compose.yaml config -q
      - run: git diff --check
